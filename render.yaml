services:
  - type: web
    name: vying-for-gold-api
    runtime: node
    plan: free
    rootDir: project/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: API_BASE_URL
        value: https://api.chatanywhere.tech
      - key: MODEL
        value: gpt-3.5-turbo
      - key: CORS_ORIGINS
        value: https://orangeorangeless.github.io
      - key: API_KEY
        sync: false
